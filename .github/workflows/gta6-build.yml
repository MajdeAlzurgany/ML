name: Build GTA6 Translator APK

on:
  push:
    branches: [main, gta6-translator]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch Tajawal font (SIL Open Font License)
        run: |
          set -e
          mkdir -p app/src/main/res/font app/src/main/assets/licenses
          base="https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal"
          for w in Regular Medium Bold ExtraBold; do
            lower=$(echo "$w" | tr '[:upper:]' '[:lower:]')
            curl -fsSL --retry 3 -o "app/src/main/res/font/tajawal_${lower}.ttf" "$base/Tajawal-$w.ttf"
          done
          curl -fsSL --retry 3 -o app/src/main/assets/licenses/Tajawal-OFL.txt "$base/OFL.txt"
          ls -la app/src/main/res/font

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release keystore configured."
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set; the APK will be signed with a temporary debug key."
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log

      - name: Report build errors as annotations
        if: failure()
        run: |
          python3 - <<'EOF'
          import re
          log = open("build.log", encoding="utf-8", errors="replace").read().splitlines()
          picked = []
          for i, line in enumerate(log):
              if re.match(r"^(e: |ERROR:|.*error:)", line) or "What went wrong" in line:
                  picked.extend(log[i:i + (6 if "What went wrong" in line else 1)])
          text = "\n".join(dict.fromkeys(picked))[:7000] or "No compiler errors found; see log."
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Build failed::{text}")
          EOF

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/GTA6-Live-Translator-v${VERSION_NAME}.apk"
          ls -la out

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "gta6-v${VERSION_NAME}" out/*.apk \
            --target "${GITHUB_SHA}" \
            --title "GTA VI Live Translator v${VERSION_NAME}" \
            --notes "Automated build from ${GITHUB_SHA::7}. Download the APK below and install it on your Android phone." \
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
